name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          # Password of a throwaway container that exists only for this job: not a secret.
          MSSQL_SA_PASSWORD: "Ci-Only-Sql-2022!"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Ci-Only-Sql-2022!' -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 20s

    env:
      # The integration tests create (and drop) a temporary database on this server.
      SECUREPROXY_TEST_SQL: "Server=localhost,1433;User Id=sa;Password=Ci-Only-Sql-2022!;TrustServerCertificate=True"
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore SecureProxyApi.sln

      - name: Build
        run: dotnet build SecureProxyApi.sln --no-restore --configuration Release

      - name: Test
        run: >-
          dotnet test SecureProxy.Tests --no-build --configuration Release
          --logger "trx;LogFileName=test-results.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
